  <body>
    <div id="app">
      <header class="topbar">
        <button class="brand" id="brand" type="button" aria-label="LOADLINE home">
          <span class="brand-anchor" aria-hidden="true"></span><span class="brand-text">LOADLINE</span>
        </button>
        <nav class="icon-row" aria-label="Game menu">
          <button class="icon-btn" id="btn-help" type="button" aria-label="How to play" title="How to play"><span class="ico ico-help" aria-hidden="true"></span></button>
          <button class="icon-btn" id="btn-stats" type="button" aria-label="Statistics" title="Statistics"><span class="ico ico-stats" aria-hidden="true"></span></button>
          <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings" title="Settings"><span class="ico ico-gear" aria-hidden="true"></span></button>

        </nav>
      </header>

      <section class="hero" id="hero">
        <h1 class="title" aria-label="LOADLINE"><span class="title-sign" data-text="LOADLINE">LOADLINE</span></h1>
        <p class="subtitle">load the ship · don't sink it · one voyage a day</p>
      </section>

      <main class="stage-wrap">
        <div class="screen-frame" id="frame">
          <canvas id="scene" width="320" height="200" aria-label="Harbour scene: a cargo ship at the dock beside a crane and a lighthouse" role="img"></canvas>
          <div class="crt" aria-hidden="true"></div>
          <div class="overlay" id="overlay"></div>
        </div>
        <div class="panel" id="panel"></div>
      </main>
